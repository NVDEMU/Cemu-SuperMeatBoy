# Super Meat Boy — speedrun profile
#
# Keep CPU emulation on the multicore recompiler and use Metal on macOS.
# DeviceShared avoids the private-buffer upload copy on Apple unified-memory
# GPUs and enables Cemu's reduced-latency Metal command-buffer threshold.

[CPU]
cpuMode = 3
threadQuantum = 45000

[Graphics]
graphics_api = 2
shaderFastMath = true
metalBufferCacheMode2 = device shared
positionInvariance2 = false
